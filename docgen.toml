[repo]
root = "target"
source_root = "target"
exclude = [".git", ".venv", "venv", "node_modules", "__pycache__", "tests", "migrations"]

[adapter]
name = "fastapi"
app = "app.main:app"

[output]
dir = "generated"

[summarize]
# This project has Claude Pro and no Bob subscription / API key, so the
# subscription backend is the one that can run here. Override per run with
# `docgen summarize --backend openai --base-url ...`.
backend = "claude_shell"
model = "sonnet"
timeout = 180
